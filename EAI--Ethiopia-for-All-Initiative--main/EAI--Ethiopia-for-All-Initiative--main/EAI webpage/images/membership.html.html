<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in || Sign up from</title>
     <!-- font awesome icons -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" integrity="sha512-KfkfwYDsLkIlwQp6LFnl8zNdLGxu9YAA1QvwINks4PhcElQSvqcyVLLD9aMhXd13uQjoXtEKNosOWaZqXgel0g==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <!-- css stylesheet -->
     <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');

* {
    padding: 0px;
    margin: 0px;
    box-sizing: border-box;
}

:root {
    --linear-grad: linear-gradient(to right, #141E30, #243B55);
    --grad-clr1: #141E30;
    --grad-clr2: #243B55;
}

body {
    background: #f6f5f7;
    display: flex;
    place-content: center;
    font-family: 'Poppins', sans-serif;
}



/*////////IMAGE - SLIDER/////////////////////////*/

.container{
    margin-left: 100px;
    margin-bottom: 100px;
    margin-top: 30px;
    position: relative;
    width: 85%;
    height: 600px;
    background: #f5f5f5;
    border-radius: 10px;
    box-shadow: 0 30px 50px #dbdbdb;
    overflow: hidden;
}

.container .slide .item{
    width: 130px;
    height: 200px;
    position: absolute;
    top: 70%;
    border: 3px solid var(--second-color);
    transform: translate(0, -50%);
    border-radius: 10px;
    background-position: 10% 70%;
    background-size: cover;
    display: inline-block;
    transition: 0.3s;
}

.slide .item:nth-child(1),
.slide .item:nth-child(2){
    top: 0;
    left: 0;
    transform: translate(0, 0);
    border-radius: 0;
    width: 100%;
    height: 100%;
    border-radius: 10px;
}

.slide .item:nth-child(3){
    left: 60%;    
    opacity: 0.7;
}
.slide .item:nth-child(4){
    left: calc(60% + 155px);
    opacity: 0.7;
}
.slide .item:nth-child(5){
    left: calc(60% + 310px);
    opacity: 0.7;
}
.slide .item:nth-child(n + 6){
    left: calc(60% + 460px);
    opacity: 0.7;
}

.item .content{
    position: absolute;
    padding: 20px;
    top: 50%;
    left: 100px;
    width: 350px;
    text-align: left;
    color: #eee;
    border-radius: 10px;
    transform: translate(0, -50%);
    font-family: 'Poppins';
    display: none;
    background: #002a00b8;
    border: 3px solid var(--second-color);

}

.slide .item:nth-child(2) .content{
    display: block;
}

.content .name{
    font-size: 40px;
    text-transform: uppercase;
    font-weight: bold;
    opacity: 0;
    animation: animate 0.5s ease-in-out 1 forwards;
}

.content .des{
    margin-top: 10px;
    margin-bottom: 20px;
    opacity: 0;
    animation: animate 0.5s ease-in-out 0.3s 1 forwards;
}

.content button{
    padding: 10px 20px;
    cursor: pointer;
    /* animation: animate 0.5s ease-in-out 0.3s 1 forwards; */
    border-radius: 10px;
    border: none;
    background-color: #002a00;
    border: 2px solid var(--second-color);
    color: white;
}
.content button:hover{
    background-color: #00370300;
    border-radius: 10px;
}
.content button:active{
    border-radius: 20px;
    background-color: #003703;
}


@keyframes animate {
    from{
        opacity: 0;
        transform: translate(0, 100px);
        filter: blur(33px);
    }

    to{
        opacity: 1;
        transform: translate(0);
        filter: blur(0);
    }
}


.left-right{
    width: 100%;
    text-align: center;
    position: absolute;
    bottom: 20px;
}

.left-right button{
    width: 40px;
    height: 35px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin: 0 5px;
    background-color: #173818e6;
    color: #fff;
    border: 2px solid var(--second-color);
    transition: 0.3s;
}

.left-right button:hover{
    background: #ffffff10;
    color: #fff;
    transition: 0.3s;
}






</style>
</head>
<body>

  
    <div class="container">
        <div class="slide">
            <div id="sliderImage" class="item" style="background-image: url(woman\ impowerment.JPG);">
            </div>
            <div id="sliderImage" class="item" style="background-image: url(training-woman.JPG);">
            </div>
            <div id="sliderImage" class="item" style="background-image: url(educating-woman.JPG);">
            </div>
            <div id="sliderImage" class="item" style="background-image: url(EAI\ Baord\ Member\ and\ voulnteers.jpg);">
            </div>
            <div id="sliderImage" class="item" style="background-image: url(training-men.JPG);">
            </div>
            <div id="sliderImage" class="item" style="background-image: url(bilal-colaboration.JPG);">
            </div>
        </div>

        <div class="left-right">
            <button class="prev"><i class="fa-solid fa-arrow-left"></i></button>
            <button class="next"><i class="fa-solid fa-arrow-right"></i></button>
        </div>

    </div> 

    
    <!-- js code -->
    <script>
        let next = document.querySelector('.next')
        let prev = document.querySelector('.prev')

        next.addEventListener('click', function(){
            let items = document.querySelectorAll('.item')
            document.querySelector('.slide').appendChild(items[0])
        })

        prev.addEventListener('click', function(){
            let items = document.querySelectorAll('.item')
            document.querySelector('.slide').prepend(items[items.length - 1]) // here the length of items = 6
        })

    </script>

</body>
</html>
